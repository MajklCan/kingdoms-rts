server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Default for everything without a content hash in its name: index.html,
    # sprites, the HUD icon sheets, audio, manifests. These keep their names
    # when their content changes, so the browser must revalidate each time
    # (a cheap 304 via ETag) instead of keeping a stale copy. A one-year
    # immutable cache here once paired a new icon layout with an old sheet.
    add_header Cache-Control "no-cache";

    # Vite's own output carries a content hash (index-BDGE8d62.js): a new
    # build means a new name, so these can be cached for good.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|map)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public assets (sprites, icons, audio): served with the no-cache default.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback: single index.html, no server router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # health endpoint for deploy checks
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
