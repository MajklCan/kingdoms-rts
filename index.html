<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0a06" />
    <title>Kingdoms - Bohemian Real-Time Strategy</title>
    <link rel="icon" type="image/svg+xml" href="/assets/ui/crest.svg" />
    <link rel="stylesheet" href="/src/ui/styles/index.css" />
  </head>
  <body data-app-state="boot">
    <!-- Phaser canvas host -->
    <div id="game-root"></div>
    <!-- Every menu, HUD, modal and overlay is rendered here by src/ui -->
    <div id="ui-root"></div>
    <!-- Static splash: covers the first frames until the scene is ready -->
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-bg" aria-hidden="true"></div>
      <div class="boot-band boot-band-top" aria-hidden="true"></div>
      <div class="boot-band boot-band-bottom" aria-hidden="true"></div>
      <div class="boot-brand">
        <div class="boot-label">Bohemia · 1278 to 1918</div>
        <div class="boot-title">Kingdoms</div>
      </div>
      <div class="boot-bar" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
