<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0a06" />
    <title>Kingdoms - Bohemian Real-Time Strategy</title>
    <link rel="icon" type="image/svg+xml" href="/assets/ui/crest.svg" />
    <link rel="stylesheet" href="/src/ui/styles/index.css" />
  </head>
  <body data-app-state="boot">
    <!-- Phaser canvas host -->
    <div id="game-root"></div>
    <!-- Every menu, HUD, modal and overlay is rendered here by src/ui -->
    <div id="ui-root"></div>
    <!-- Static splash: covers the first frames until the scene is ready -->
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-inner">
        <img src="/assets/ui/crest.svg" alt="" width="200" height="244" />
        <div class="boot-label">Preparing the realm</div>
        <div class="boot-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
